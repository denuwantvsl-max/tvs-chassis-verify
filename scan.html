<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e18">
<meta name="robots" content="noindex">
<title>Chassis Verify Photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+Sinhala:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #090e18; --bg2: #0d1422; --card: #121a2b; --card2: #172238; --line: #22304a; --line2: #2e4063; --ink: #e9eef7; --mute: #94a3bf;
  --brand: #3d7bfd; --ok: #22c55e; --red: #ef4444; --amber: #f59e0b; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, "Noto Sans Sinhala", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
body.si { font-family: "Noto Sans Sinhala", Inter, system-ui, sans-serif; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lang { position: fixed; top: calc(10px + var(--safe-t)); right: 10px; z-index: 70; display: flex; border-radius: 99px; overflow: hidden; border: 1px solid rgba(255,255,255,.3);
  background: rgba(10,14,24,.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.lang button { border: 0; background: transparent; color: #cbd5e1; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.lang button.on { background: #fff; color: #111; }
.page { max-width: 520px; margin: 0 auto; padding: calc(56px + var(--safe-t)) 16px calc(28px + var(--safe-b)); animation: rise .25s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.logo { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 12px; background: linear-gradient(140deg, #4f8cff, #1d4ed8); }
.logo svg { width: 30px; height: 30px; stroke: #fff; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; text-align: center; line-height: 1.25; }
.sub { color: var(--mute); text-align: center; margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.inp { width: 100%; height: 58px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line2); background: var(--bg2); font-size: 20px; font-weight: 600; outline: none; }
.inp:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(61,123,253,.25); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; padding: 8px 18px; border-radius: 16px; border: 1px solid var(--line2);
  background: var(--card2); font-weight: 700; font-size: 18px; cursor: pointer; text-align: center; line-height: 1.25; }
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn.primary { background: linear-gradient(180deg, #4b86ff, #2f6bf0); border-color: transparent; color: #fff; }
.btn.white { background: #fff; color: #111; border-color: transparent; }
.btn.amber { background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #2a1a00; border-color: transparent; }
.btn.yes { background: linear-gradient(180deg, #2fd56c, #16a34a); color: #04170b; border-color: transparent; min-height: 74px; font-size: 21px; }
.btn.no { background: #b3121b; color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.stack { display: grid; gap: 12px; }
.err { color: #fca5a5; font-size: 15px; white-space: pre-line; } .err:empty { display: none; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; color: var(--mute); font-size: 14px; flex-wrap: wrap; }
.who b { color: var(--ink); }
.who button { margin-left: auto; background: none; border: 1px solid var(--line2); border-radius: 10px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.ship { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; cursor: pointer; }
.ship b { display: block; font-size: 17px; } .ship span { color: var(--mute); font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--bg2); overflow: hidden; margin-top: 10px; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #16a34a, #4ade80); }
.upq { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--safe-b)); z-index: 65; background: rgba(15,23,42,.92); color: #cbd5e1; font-size: 12.5px;
  padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.15); white-space: nowrap; }

/* camera */
.full { position: fixed; inset: 0; z-index: 40; background: #000; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shadebox { position: absolute; left: 0; right: 0; top: calc(86px + var(--safe-t)); bottom: calc(196px + var(--safe-b)); display: grid; place-items: center; pointer-events: none; }
.guide { position: relative; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.58); }
.guide::before, .guide::after, .guide i::before, .guide i::after { content: ""; position: absolute; width: 26px; height: 26px; border: 3px solid #fff; }
.guide::before { left: -3px; top: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.guide::after { right: -3px; top: -3px; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.guide i::before { left: -3px; bottom: -3px; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.guide i::after { right: -3px; bottom: -3px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
.cam-top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + var(--safe-t)) 120px 26px 12px; background: linear-gradient(180deg, rgba(0,0,0,.8), transparent); color: #fff;
  display: flex; align-items: center; gap: 10px; }
.glass { background: rgba(20,26,40,.55); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; }
.round { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.round.on { background: #fde047; color: #111; }
.cam-hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(150px + var(--safe-b)); padding: 9px 16px; border-radius: 99px; font-size: 14px; font-weight: 700;
  width: max-content; max-width: calc(100% - 24px); text-align: center; }
.cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 24px calc(22px + var(--safe-b)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: linear-gradient(0deg, rgba(0,0,0,.8), transparent); }
.side { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #e2e8f0; text-align: center; }
.shutter { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 5px; cursor: pointer; }
.shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; }
.cam-alt { position: absolute; left: 0; right: 0; bottom: calc(118px + var(--safe-b)); text-align: center; }
.cam-alt button { background: none; border: 0; color: #cbd5e1; font-size: 13px; text-decoration: underline; cursor: pointer; }
.cam-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #cbd5e1; }
.proc { position: absolute; inset: 0; background: #05080f; display: grid; place-items: center; text-align: center; padding: 24px; }
.proc img { max-width: 100%; max-height: 50vh; border-radius: 14px; margin-bottom: 20px; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid #60a5fa; border-right-color: transparent; animation: spin .8s linear infinite; margin: 0 auto 12px; }
.spin.sm { width: 18px; height: 18px; border-width: 2.5px; display: inline-block; margin: 0; vertical-align: -3px; border-color: currentColor; border-right-color: transparent; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.clock { font-family: var(--mono); font-size: 14px; color: #94a3bf; margin-top: 8px; }

/* result */
.result { overflow-y: auto; }
.result[data-s="OK"] { background: radial-gradient(120% 70% at 50% 0%, #0f7a3d, #07391e 45%, #04140b); }
.result[data-s="ENGINE"] { background: radial-gradient(120% 70% at 50% 0%, #10593a, #0b2a22 50%, #070e12); }
.result[data-s="NOT OK"] { background: radial-gradient(120% 70% at 50% 0%, #e11d2a, #a3111a 50%, #6b0a10); }
.result[data-s="RETAKE"] { background: radial-gradient(120% 70% at 50% 0%, #b7740a, #6a4205 50%, #241603); }
.result[data-s="NOT OK"]::before { content: ""; position: fixed; inset: 0; pointer-events: none; animation: alarm 1.4s ease-in-out infinite; }
@keyframes alarm { 50% { box-shadow: inset 0 0 90px 10px rgba(255,220,220,.35); } }
.res { max-width: 560px; margin: 0 auto; padding: calc(52px + var(--safe-t)) 16px calc(40px + var(--safe-b)); color: #fff; }
.head { text-align: center; padding: 0 0 14px; }
.badge { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.badge svg { width: 48px; height: 48px; stroke-width: 2.6; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
.head h2 { font-size: 30px; font-weight: 800; margin: 0; line-height: 1.2; }
.head p { margin: 6px 0 0; font-weight: 600; opacity: .9; }
.panel { background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.16); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .75; margin: 0 0 7px; }
body.si .lbl { text-transform: none; letter-spacing: 0; font-size: 13px; }
.chars { display: grid; gap: 3px; margin-bottom: 12px; } .chars:last-child { margin-bottom: 0; }
.ch { aspect-ratio: .74; display: grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); font-family: var(--mono); font-weight: 800; font-size: clamp(11px, 4.2vw, 22px); min-width: 0; }
.ch.diff { background: #fde047; color: #111; border-color: #fde047; } .ch.gap { background: transparent; border: 1.5px dashed rgba(255,255,255,.55); } .ch.warn { background: rgba(253,186,116,.35); border-color: #fdba74; }
.eng .ch { background: #fff; color: #111; border-color: #fff; font-size: clamp(16px, 6.4vw, 30px); aspect-ratio: .7; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; } .reasons li { display: flex; gap: 10px; font-weight: 600; } .reasons li.info { font-weight: 500; opacity: .85; }
.wait { display: flex; align-items: center; gap: 12px; background: #fff; color: #7f1d1d; border-radius: 16px; padding: 16px; font-weight: 700; margin-bottom: 12px; }
.decision { background: #fff; color: #111; border-radius: 16px; padding: 16px; margin-bottom: 12px; } .decision b { color: #b3121b; }
.auto { height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; margin-top: 10px; }
.auto i { display: block; height: 100%; background: #fff; transform-origin: left; animation: shrink var(--t, 4s) linear forwards; } @keyframes shrink { to { transform: scaleX(0); } }
.timing { text-align: center; font-size: 12.5px; opacity: .7; margin-top: 12px; font-family: var(--mono); }
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(2,6,14,.75); display: grid; align-items: end; }
.sheet { background: var(--card); border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + var(--safe-b)); max-height: 90vh; overflow-y: auto; } .sheet img { width: 100%; border-radius: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(50px + var(--safe-b)); transform: translateX(-50%); z-index: 90; background: #f8fafc; color: #0f172a; padding: 12px 18px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>

<div class="lang" role="group" aria-label="Language"><button data-l="en">English</button><button data-l="si">සිංහල</button></div>

<section class="page" id="v-nokey" hidden>
  <div class="logo"><svg class="i"><use href="#i-shield"/></svg></div>
  <h1 data-t="appTitle"></h1>
  <p class="sub" data-t="notSetup"></p>
  <div class="card" data-t="notSetupHelp"></div>
</section>

<section class="page" id="v-name" hidden>
  <div class="logo"><svg class="i"><use href="#i-shield"/></svg></div>
  <h1>Chassis Verify</h1>
  <p class="sub" id="stName"></p>
  <div class="stack">
    <label style="font-weight:700;color:var(--mute)" data-t="typeName"></label>
    <input class="inp" id="opName" maxlength="40" autocomplete="name">
    <div class="err" id="nameErr"></div>
    <button class="btn primary" id="btnName" data-t="start"></button>
  </div>
</section>

<section class="page" id="v-ship" hidden>
  <div class="who"><span><span data-t="photoBy"></span> <b id="whoName"></b> · <span id="whoSt"></span></span><button id="btnChange" data-t="changeName"></button></div>
  <h1 style="text-align:left" data-t="whichShip"></h1>
  <p class="sub" style="text-align:left" data-t="chooseShip"></p>
  <div class="stack" id="shipList"></div>
  <button class="btn ghost" id="btnReload" style="margin-top:16px" data-t="refresh"></button>
</section>

<section class="full cam" id="v-cam" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="shadebox"><div class="guide" id="guide"><i></i></div></div>
  <div class="cam-top">
    <button class="round glass" id="camBack" style="width:44px;height:44px" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button>
    <div style="min-width:0;flex:1"><div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="camShip"></div><div style="font-size:12.5px;color:#cbd5e1" id="camProg"></div></div>
  </div>
  <div class="cam-hint glass" data-t="camHint"></div>
  <div class="cam-alt"><button id="camFile" data-t="camNotWorking"></button></div>
  <div class="cam-bottom">
    <div class="side"><button class="round glass" id="camRotate" aria-label="Turn frame"><svg class="i"><use href="#i-rotate"/></svg></button><span id="rotLbl"></span></div>
    <button class="shutter" id="camShoot" aria-label="Take photo"><span></span></button>
    <div class="side"><button class="round glass" id="camTorch" aria-label="Torch"><svg class="i"><use href="#i-flash"/></svg></button><span data-t="torch"></span></div>
  </div>
  <div class="cam-msg" id="camMsg" hidden><div class="stack" style="max-width:340px"><div id="camMsgText"></div><button class="btn primary" id="camMsgBtn" data-t="choosePhoto"></button></div></div>
  <input type="file" id="fileShot" accept="image/*" capture="environment" hidden>
  <div class="proc" id="proc" hidden><div><img id="procImg" alt=""><div class="spin"></div><div style="font-weight:700;font-size:18px" id="procText"></div><div class="clock" id="procClock"></div></div></div>
</section>

<section class="full result" id="v-res" hidden><div class="res" id="res"></div></section>
<div id="modalRoot"></div>
<div class="upq" id="upq" hidden></div>
<div class="toast" id="toast" hidden></div>

/* ---------------- evidence upload queue (kept on the phone until the server has it) ---------------- */
function saveQueue() { if (!ls.set(LS.queue, JSON.stringify(S.queue))) ls.set(LS.queue, JSON.stringify(S.queue.slice(-3))); }
function queueEvidence(scanId, src) {
  setTimeout(() => {                         // after the result is on screen
    try { const e = evidenceImages(src); S.queue.push({ scanId, photo: e.photo, thumb: e.thumb, key: S.key }); saveQueue(); renderQueue(); pumpQueue(); } catch (err) { /* */ }
  }, 50);
}
async function pumpQueue() {
  if (S.uploading || !S.queue.length) return renderQueue();
  S.uploading = true; renderQueue();
  while (S.queue.length) {
    const it = S.queue[0];
    try {
      await api('stEvidence', { scanId: it.scanId, photo: it.photo, thumb: it.thumb, station: it.key || S.key }, 90000);
      S.queue.shift(); saveQueue();
    } catch (e) {
      if (e.net) { S.uploading = false; renderQueue(); setTimeout(pumpQueue, 15000); return; }   // no signal: try again later
      S.queue.shift(); saveQueue();          // refused by the server (e.g. already saved): drop it
    }
  }
  S.uploading = false; renderQueue();

  const q = $('#upq'), n = S.queue.length;
  q.hidden = !n; if (n) q.textContent = n > 1 || !S.uploading ? T('upWaiting', { n }) : T('upSaving');
}
window.addEventListener('online', pumpQueue);

/* ---------------- scan ---------------- */

  S.busy = true;
  $('#proc').hidden = false; $('#procText').textContent = T('checking'); $('#procClock').textContent = '';
  await new Promise(r => setTimeout(r, 30));
  let img;
  try { img = processImage(src, rect, vertical); } catch (e) { S.busy = false; $('#proc').hidden = true; return toast(e.message); }

  const q = img.quality;
  const problem = q.sharpness < SHARP_MIN ? 'blurry' : q.brightness < DARK_MAX ? 'dark' : q.glare > GLARE_MAX ? 'glare' : '';
  if (problem && !force) {
    S.busy = false;
    const m = modal(`<h3 style="margin:0 0 6px;color:#fcd34d">${esc(T('checkPhoto'))}</h3><p>${esc(T(problem))}</p><img src="${img.crop}" alt="">
      <div class="stack" style="margin-top:12px"><button class="btn primary" id="qR">${icon('camera')}${esc(T('takeAgain'))}</button><button class="btn" id="qU">${esc(T('useThis'))}</button></div>`);
    $('#qR', m).onclick = () => { closeModal(); $('#proc').hidden = true; };
    $('#qU', m).onclick = () => { closeModal(); runScan(src, rect, vertical, true); };
    return;
  }
  $('#procText').textContent = T('reading');
  const t0 = performance.now(), clock = setInterval(() => { $('#procClock').textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s'; }, 100);
  try {
    const r = await api('stChassis', { shipment: S.ship.id, crop: img.crop, quality: q });
    r.phoneSeconds = Math.round((performance.now() - t0) / 100) / 10;
    r.thumb = img.crop;
    if (r.counts) Object.assign(S.ship, { verified: r.counts.verified, units: r.counts.units });
    queueEvidence(r.id, src);
    showResult(r);
  } catch (e) {
    $('#proc').hidden = true;
    if (e.locked) return showWaiting(e.locked);
    modal(`<h3 style="margin:0 0 6px">${esc(T('notSaved'))}</h3><p>${esc(e.message)}</p><p style="color:var(--mute);font-size:14px">${esc(T('nothingRecorded'))}</p><button class="btn primary" data-close>${esc(T('ok'))}</button>`);
  } finally { clearInterval(clock); S.busy = false; }
}

/* ---------------- result screens ---------------- */
function align(a, b) {
  const n = a.length, m = b.length, D = [];
  for (let i = 0; i <= n; i++) D[i] = [i];
  for (let j = 0; j <= m; j++) D[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  const out = []; let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && D[i][j] === D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) { out.unshift([a[i - 1], b[j - 1]]); i--; j--; }
    else if (i > 0 && D[i][j] === D[i - 1][j] + 1) { out.unshift([a[i - 1], '']); i--; } else { out.unshift(['', b[j - 1]]); j--; }
  }
  return out;
}
function charGrid(read, expected, chars, labelA, labelB, cls) {
  const probs = (chars || []).map(c => c.p); read = read || '';
  if (!expected || expected === read) {
    const g = `grid-template-columns:repeat(${Math.max(1, read.length)},minmax(0,1fr))`;
    return `<div class="lbl">${esc(labelA)}</div><div class="chars ${cls || ''}" style="${g}">${read.split('').map((c, i) => `<div class="ch ${probs[i] && probs[i] !== 'none' ? 'warn' : ''}">${esc(c)}</div>`).join('')}</div>`;
  }
  const al = align(read, expected), g = `grid-template-columns:repeat(${al.length},minmax(0,1fr))`; let ri = 0;
  const top = al.map(([a, b]) => { const p = a ? probs[ri++] : ''; return `<div class="ch ${!a ? 'gap' : a !== b ? 'diff' : ''} ${p && p !== 'none' ? 'warn' : ''}">${a ? esc(a) : '·'}</div>`; }).join('');
  const bot = al.map(([a, b]) => `<div class="ch ${!b ? 'gap' : a !== b ? 'diff' : ''}">${b ? esc(b) : '·'}</div>`).join('');
  return `<div class="lbl">${esc(labelA)}</div><div class="chars" style="${g}">${top}</div><div class="lbl">${esc(labelB)}</div><div class="chars" style="${g}">${bot}</div>`;
}
const timing = r => r.phoneSeconds != null ? `<div class="timing">${esc(T('checkedIn', { s: r.phoneSeconds }))}${r.aiSeconds ? ' · AI ' + r.aiSeconds + ' s' : ''}</div>` : '';

function paint(state, head, body) {
  show('v-res');
  const v = $('#v-res'); v.dataset.s = state; v.scrollTop = 0;
  $('#res').innerHTML = `<div class="head"><div class="badge">${icon(head[0])}</div><h2>${esc(head[1])}</h2><p>${esc(head[2])}</p></div>${body}`;
}

function showResult(r) {
  if (r.result === 'OK') { S.line = r.match; S.chassisScan = r.id; S.retakes = 0; return showEngineCheck(r); }
  if (r.result === 'NOT OK') return showNotOk(r);
  S.retakes++;
  const draw = () => {
    paint('RETAKE', ['camera', T('retake'), T('retakeSub')],
      `<div class="panel"><ul class="reasons">${r.reasons.map(x => `<li>${icon('alert')}<span>${esc(reasonText(x))}</span></li>`).join('')}</ul>
      ${S.retakes >= 3 ? `<p style="margin:10px 0 0;color:#fde68a">${esc(T('tries', { n: S.retakes }))}</p>` : ''}</div>
      <button class="btn amber" id="rRetake">${icon('camera')}${esc(T('retakeBtn'))}</button>${timing(r)}`);
    $('#rRetake').onclick = () => openCamera();
  };
  draw(); S.last = draw;
  sound('RETAKE');
}

function showEngineCheck(r) {
  const draw = (diff) => {
    paint('ENGINE', ['check', T('chassisOk'), T('lineModel', { l: r.match.line, m: r.match.model })],
      `<div class="panel">${charGrid(r.read, '', r.chars, T('chassisNo') + ' ✓')}</div>
      <div class="panel" style="border-color:#fbbf24;background:rgba(0,0,0,.35)">
        <div style="font-size:20px;font-weight:800;margin-bottom:4px">${icon('eye')} ${esc(T('engineTitle'))}</div>
        <p style="margin:0 0 12px;opacity:.9">${esc(T('engineHelp'))}</p>
        ${charGrid(r.engine || '—', '', [], T('engineNo') + ' · ' + T('packingList') + ' · ' + T('line') + ' ' + r.match.line, '', 'eng')}
      </div>
      ${diff ? `<div class="panel stack"><label style="font-weight:700">${esc(T('engineSeen'))}</label>
          <input class="inp" id="eSeen" maxlength="24" autocapitalize="characters" autocomplete="off" style="font-family:var(--mono)">
          <button class="btn no" id="eReport">${icon('x')}${esc(T('reportNotOk'))}</button><button class="btn ghost" id="eBack" style="color:#fff">${esc(T('back'))}</button></div>`
        : `<div class="stack"><button class="btn yes" id="eYes">${icon('check')}${esc(T('engineSame'))}</button><button class="btn no" id="eNo">${icon('x')}${esc(T('engineDiff'))}</button></div>`}
      ${timing(r)}`);
    if ($('#eYes')) $('#eYes').onclick = () => engineAnswer(true, '', $('#eYes'));
    if ($('#eNo')) $('#eNo').onclick = () => { draw(true); S.last = () => draw(true); $('#eSeen').focus(); };
    if ($('#eBack')) $('#eBack').onclick = () => { draw(false); S.last = () => draw(false); };
    if ($('#eReport')) $('#eReport').onclick = () => engineAnswer(false, $('#eSeen').value, $('#eReport'));
  };
  draw(false); S.last = () => draw(false);
  sound('OK');
}

async function engineAnswer(same, seen, btn) {
  if (btn.disabled) return;
  btn.disabled = true; const h = btn.innerHTML; btn.innerHTML = '<span class="spin sm"></span>';
  try {
    const r = await api('stEye', { shipment: S.ship.id, line: S.line.line, chassisScan: S.chassisScan, same, seen });
    if (r.counts) Object.assign(S.ship, { verified: r.counts.verified, units: r.counts.units });
    if (r.result === 'OK') showVerified(r); else showNotOk(r);
  } catch (e) {
    btn.disabled = false; btn.innerHTML = h;
    if (e.locked) return showWaiting(e.locked);
    toast(e.message);
  }
}

function showVerified(r) {
  const draw = () => {
    paint('OK', ['check', T('verified'), T('verifiedSub', { l: r.match.line })],
      `<div class="panel">${charGrid(r.match.chassis, '', [], T('chassisNo') + ' ✓')}${charGrid(r.read, '', [], T('engineNo') + ' ✓')}<div style="font-weight:600">${esc(r.match.model)}</div></div>
      <div class="panel" style="display:flex;justify-content:space-between;font-weight:700;gap:8px;flex-wrap:wrap"><span>${esc(T('done', { v: S.ship.verified, u: S.ship.units }))}</span><span>${fmtT(r.when)} · ${esc(S.name)}</span></div>
      <button class="btn white" id="rNext" style="color:#065f2c">${icon('camera')}${esc(T('nextBike'))}</button><div class="auto" style="--t:3s"><i></i></div>`);
    $('#rNext').onclick = () => { clearTimeout(S.autoT); startBike(); };
  };
  draw(); S.last = draw;
  S.autoT = setTimeout(startBike, 3000);
  sound('OK');
}

function showNotOk(r) {
  S.waiting = r.issue;
  const eng = r.kind === 'ENGINE';
  const draw = () => {
    paint('NOT OK', ['x', T('notOk'), T('notOkSub')],
      `<div class="panel">${charGrid(r.read, r.expected, r.chars, (eng ? T('engineNo') : T('chassisNo')) + ' · ' + T('onBike'), T('packingList') + (r.expectedLine ? ' · ' + T('line') + ' ' + r.expectedLine : ''))}</div>
      <div class="panel"><ul class="reasons">${r.reasons.map(x => `<li class="${x.level === 'info' ? 'info' : ''}">${icon(x.level === 'info' ? 'info' : 'x')}<span>${esc(reasonText(x))}</span></li>`).join('')}</ul></div>
      <div id="waitSlot">${waitBox()}</div>${timing(r)}`);
  };
  draw(); S.last = () => { draw(); if (S.decided) showDecision(S.decided); };
  S.decided = null;
  sound('NOT OK');
  startPolling();
}

function waitBox() { return `<div class="wait"><span class="spin sm"></span><span>${esc(T('wait'))}</span></div>`; }

function showWaiting(lock) {
  S.waiting = lock.id; S.decided = null;
  if (!S.ship) S.ship = S.shipments.find(s => s.id === lock.shipment) || { id: lock.shipment, name: lock.shipment, units: 0, verified: 0 };
  const draw = () => {
    paint('NOT OK', ['x', T('notOk'), (lock.kind === 'ENGINE' ? T('engineNo') : T('chassisNo')) + ' · ' + fmtT(lock.when) + ' · ' + lock.operator],
      `<div class="panel">${charGrid(lock.read, lock.expected, [], T('onBike'), T('packingList') + (lock.line ? ' · ' + T('line') + ' ' + lock.line : ''))}</div>
      <div class="panel"><ul class="reasons">${lock.reasons.map(t => `<li class="${/^Closest/.test(t) ? 'info' : ''}">${icon('x')}<span>${esc(t)}</span></li>`).join('')}</ul></div><div id="waitSlot">${waitBox()}</div>`);
  };
  draw(); S.last = () => { draw(); if (S.decided) showDecision(S.decided); };
  startPolling();
}

function startPolling() {
  clearInterval(S.poll);
  S.poll = setInterval(async () => {
    try {
      const d = await api('stStatus', { waiting: S.waiting, shipment: S.ship ? S.ship.id : '' }, 20000);
      if (d.progress && S.ship) Object.assign(S.ship, d.progress);
      if (!d.lock) { clearInterval(S.poll); S.decided = d.decided || { decision: 'Released' }; showDecision(S.decided); sound('OK'); }
    } catch (e) { /* keep waiting */ }
  }, 4000);
}

function showDecision(dec) {
  const slot = $('#waitSlot');
  if (!slot) return;
  slot.innerHTML = `<div class="decision"><div class="lbl" style="opacity:.6">${esc(T('decision'))}</div>
    <div style="font-size:19px;font-weight:800;margin:4px 0"><b>${esc(T('hold'))}</b></div>
    ${dec.note ? `<div>${esc(dec.note)}</div><div style="font-size:13px;color:#555;margin-top:6px">${esc(dec.decidedBy || '')} · ${fmtT(dec.decidedAt)}</div>` : ''}</div>
    <button class="btn white" id="rNext">${icon('camera')}${esc(T('nextBike'))}</button>`;
  $('#rNext').onclick = () => { S.waiting = ''; S.decided = null; if (S.ship && S.ship.units) startBike(); else showShipments(true); };
}

/* ---------------- misc ---------------- */
function modal(html) {
  $('#modalRoot').innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`;
  const m = $('#modalRoot .modal');
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) closeModal(); });
  return m;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
let AC = null;
function sound(kind) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const tone = (f, t0, d, type = 'sine', vol = .25) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, AC.currentTime + t0); g.gain.linearRampToValueAtTime(vol, AC.currentTime + t0 + .01); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t0 + d);
      o.connect(g); g.connect(AC.destination); o.start(AC.currentTime + t0); o.stop(AC.currentTime + t0 + d + .02); };
    if (kind === 'OK') { tone(880, 0, .12); tone(1320, .13, .18); } else if (kind === 'NOT OK') [0, .32, .64].forEach(t => tone(240, t, .26, 'square', .2)); else tone(520, 0, .25, 'triangle');
  } catch (e) { /* */ }
  try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(kind === 'OK' ? 60 : kind === 'NOT OK' ? [300, 100, 300, 100, 600] : [150]); } catch (e) { /* */ }
}

$$('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.l));
$('#btnName').onclick = setName;
$('#opName').addEventListener('keydown', e => { if (e.key === 'Enter') setName(); });
$('#btnChange').onclick = () => { show('v-name'); $('#opName').value = ''; $('#opName').focus(); };
$('#btnReload').onclick = () => showShipments(true);
$('#camBack').onclick = () => showShipments(true);
$('#camShoot').onclick = shoot;
$('#camTorch').onclick = toggleTorch;
$('#camRotate').onclick = () => { S.plate = S.plate === 'v' ? 'h' : 'v'; ls.set(LS.plate, S.plate); setGuide(); };
$('#camFile').onclick = () => $('#fileShot').click();
$('#camMsgBtn').onclick = () => $('#fileShot').click();
$('#fileShot').onchange = e => { const f = e.target.files[0]; e.target.value = ''; fromFile(f); };
window.addEventListener('resize', () => { if (!$('#v-cam').hidden) setGuide(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); else { pumpQueue(); if (!$('#v-cam').hidden && $('#proc').hidden) openCamera(); } });
boot();
</script>
